name: mafia_local
description: "مافیا لوکال (Mafia Local) — بازی مافیا چندنفره آفلاین روی شبکه محلی (LAN)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  shelf_static: ^1.1.2
  web_socket_channel: ^3.0.1
  network_info_plus: ^6.0.1
  flutter_foreground_task: ^8.10.0
  wakelock_plus: ^1.2.8
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
